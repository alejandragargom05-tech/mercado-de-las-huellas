"1" d="M196 110 H220 V168 H196Z" /><path class="v d" pathLength="1" d="M202 110 V100 H214 V110" /><path class="l" d="M202 100 V94 H214 V100" style="stroke-width:2"/><path class="b" d="M208 126 q-6 9 0 13 q6 -4 0 -13z"/>
