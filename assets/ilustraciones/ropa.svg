<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="t d">
<title id="t">Perro con su saco de lana</title><desc id="d">Un perro de pie lleva un saco tejido de rayas y mueve la cola; a su lado cuelga un abrigo pequeño de un gancho.</desc>
<style>
.l,.w,.v{stroke:#2B3CA0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.l{fill:none}.w{fill:#fff}.v{fill:#C8CBE8}
.t{stroke-width:1.8}
