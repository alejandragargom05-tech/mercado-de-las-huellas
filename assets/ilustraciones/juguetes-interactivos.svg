@keyframes bola{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.gota{animation:gota 1s ease-in infinite}
@keyframes gota{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.zz{animation:zz 3s ease-out infinite}
@keyframes zz{0%{transform:translateY(6px);opacity:0}15%{opacity:1}33%,100%{transform:translateY(-6px);opacity:0}}
.resp{transform-origin:50% 100%;animation:resp 3s ease-in-out infinite}
@keyframes resp{0%,33%,100%{transform:scale(1)}16%{transform:scale(1.025,1.04)}}
.burb{animation:burb 3s ease-out infinite}
@keyframes burb{0%{transform:translateY(4px);opacity:0}12%{opacity:1}33%,100%{transform:translateY(-8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.d{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
