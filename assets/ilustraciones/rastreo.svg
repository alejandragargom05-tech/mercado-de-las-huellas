<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="t d">
<title id="t">Perro con su placa y su GPS</title><desc id="d">Un perro corre con un collar y una placa colgando; arriba, un pin de ubicación con ondas de señal marca dónde está.</desc>
<style>
.l,.w,.v{stroke:#2B3CA0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.l{fill:none}.w{fill:#fff}.v{fill:#C8CBE8}
.t{stroke-width:1.8}
.b{fill:#2B3CA0;stroke:none}
.s{fill:#C8CBE8;stroke:none}
.n{fill:none;stroke:#C8CBE8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja .9s ease-out forwards}
@keyframes dibuja{to{stroke-dashoffset:0}}
.cola,.oreja,.ojo,.resp{transform-box:fill-box}
.cola{transform-origin:0 100%;animation:cola 3s ease-in-out 1s infinite}
@keyframes cola{0%,25%,100%{transform:rotate(0)}8%{transform:rotate(-12deg)}17%{transform:rotate(7deg)}}
.oreja{transform-origin:50% 100%;animation:oreja 5s ease-in-out 1.5s infinite}
@keyframes oreja{0%,12%,100%{transform:rotate(0)}4%{transform:rotate(-14deg)}8%{transform:rotate(4deg)}}
.ojo{transform-origin:50% 50%;animation:ojo 4s ease-in-out 1s infinite}
@keyframes ojo{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bola{transform-origin:150px 76px;animation:bola 1s ease-in-out infinite alternate}
@keyframes bola{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.gota{animation:gota 1s ease-in infinite}
@keyframes gota{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.zz{animation:zz 3s ease-out infinite}
@keyframes zz{0%{transform:translateY(6px);opacity:0}15%{opacity:1}33%,100%{transform:translateY(-6px);opacity:0}}
.resp{transform-origin:50% 100%;animation:resp 3s ease-in-out infinite}
@keyframes resp{0%,33%,100%{transform:scale(1)}16%{transform:scale(1.025,1.04)}}
.burb{animation:burb 3s ease-out infinite}
@keyframes burb{0%{transform:translateY(4px);opacity:0}12%{opacity:1}33%,100%{transform:translateY(-8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.d{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
