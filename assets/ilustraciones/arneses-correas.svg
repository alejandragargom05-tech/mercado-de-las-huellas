<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="t d">
<title id="t">Perro con arnés corriendo</title><desc id="d">Un perro con arnés y correa al viento corre a toda velocidad, con rayas de movimiento atrás.</desc>
<style>
.l,.w,.v{stroke:#2B3CA0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.l{fill:none}.w{fill:#fff}.v{fill:#C8CBE8}
.t{stroke-width:1.8}
.b{fill:#2B3CA0;stroke:none}
.s{fill:#C8CBE8;stroke:none}
.n{fill:none;stroke:#C8CBE8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja .9s ease-out forwards}
@keyframes dibuja{to{stroke-dashoffset:0}}
.cola,.oreja,.ojo,.resp{transform-box:fill-box}
.cola{transform-origin:0 100%;animation:cola 3s ease-in-out 1s infinite}
@keyframes cola{0%,25%,100%{transform:rotate(0)}8%{transform:rotate(-12deg)}17%{transform:rotate(7deg)}}
.oreja{transform-origin:50% 100%;animation:oreja 5s ease-in-out 1.5s infinite}
