<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="t d">
<title id="t">Un gato y un perro dándose cariño</title><desc id="d">Un perro sentado y un gato apoyan la cabeza el uno contra el otro con los ojos cerrados; flotan unos corazones sobre ellos.</desc>
<style>
.l,.w,.v{stroke:#2B3CA0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.l{fill:none}.w{fill:#fff}.v{fill:#C8CBE8}
.b{fill:#2B3CA0;stroke:none}
.n{fill:none;stroke:#C8CBE8;stroke-width:2.5;stroke-linecap:round}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja .9s ease-out forwards}
@keyframes dibuja{to{stroke-dashoffset:0}}
.cola{transform-box:fill-box;transform-origin:100% 100%;animation:cola 2.4s ease-in-out 1s infinite}
@keyframes cola{0%,40%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-8deg)}}
.cola-g{transform-box:fill-box;transform-origin:0 100%;animation:cola-g 3.4s ease-in-out 1s infinite}
@keyframes cola-g{0%,50%,100%{transform:rotate(0)}15%{transform:rotate(10deg)}30%{transform:rotate(-6deg)}}
.cora{transform-box:fill-box;transform-origin:50% 100%;animation:cora 2.8s ease-out infinite}
.cora:nth-of-type(2){animation-delay:1.1s}
@keyframes cora{0%{transform:translateY(8px) scale(.6);opacity:0}20%{opacity:1}70%,100%{transform:translateY(-10px) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.d{stroke-dasharray:none;stroke-dashoffset:0}.cora{opacity:1}}
</style>
